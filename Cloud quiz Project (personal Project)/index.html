  const rows=Object.values(best).sort((a,b)=>b.score-a.score||b.at-a.at).slice(0,10);
  $.innerHTML=`<h1>Cloud Engineering Quiz</h1>
  <p class="mute">Linux, bash, cron, cloud models and AWS basics. ${N} questions per attempt, then a cheat sheet for what you missed.</p>
  <div class="card"><label for="nm">Your name</label><input id="nm" type="text" maxlength="24" value="${esc(D.name)}" autocomplete="nickname">
  <label style="margin-top:14px">Question order</label>
  <div class="row modes" style="margin-top:0">
   <button data-m="random" aria-pressed="${S.mode==="random"}">Random<small>Mixed difficulty</small></button>
   <button data-m="climb" aria-pressed="${S.mode==="climb"}">Easy to hard<small>Warm up, then climb</small></button></div>
  <div class="row"><button class="primary" id="go">Start exam</button></div></div>
  <h2>Class scoreboard</h2><div class="card" id="board"><p class="mute">Loading…</p></div>
  <h2>Your scores on this device</h2>
  ${rows.length?`<div class="card"><table><tr><th>Player</th><th>Best</th><th>Attempts</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.score}/${N}</td><td>${r.n}</td></tr>`).join("")}</table></div>
  <button id="clr" class="mute">Clear scores</button>`:`<p class="mute">No exams taken yet. Finish an exam and your score shows up here.</p>`}
  <p class="mute">Scores are saved in this browser only, so each person sees their own device’s scoreboard.</p>`;
  $.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{D.name=document.getElementById("nm").value;S.mode=b.dataset.m;home()});
  document.getElementById("go").onclick=()=>{
    const n=document.getElementById("nm").value.trim();
    if(!n){document.getElementById("nm").focus();document.getElementById("nm").placeholder="Enter a name to start";return}
    D.name=n;save(D);S={mode:S.mode,qs:build(S.mode),i:0,score:0,miss:[],done:false};ask();
  };
  const c=document.getElementById("clr");if(c)c.onclick=()=>{if(confirm("Clear all saved scores on this device?")){D.hist=[];save(D);home()}};
  loadBoard();
}

function ask(){
  const q=S.qs[S.i];S.done=false;
  $.innerHTML=`<div class="meta"><span>${esc(D.name)} · Question ${S.i+1} of ${N}</span><span>Score ${S.score}</span></div>
  <div class="bar"><i style="width:${S.i/N*100}%"></i></div>
  <p class="tag">${esc(q.t)} · ${DN[q.d]}</p>
  <div class="term">${esc(q.q)}</div>
  ${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${esc(t)}</span></button>`).join("")}
  <div id="fb"></div>`;
  $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickAns(+b.dataset.i));
}

function pickAns(i){
  if(S.done)return;S.done=true;
  const q=S.qs[S.i],ok=i===q.a;
  if(ok)S.score++;else S.miss.push({...q,got:i});
  $.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
  const last=S.i===N-1;
  document.getElementById("fb").innerHTML=`<div class="exp"><b class="${ok?"right":""}">${ok?"Correct.":"Not quite. The answer is "+L[q.a]+"."}</b><p>${esc(q.e)}</p></div>
  <button class="primary" id="nx">${last?"See results":"Next question"}</button>`;
  const n=document.getElementById("nx");n.focus();
  n.onclick=()=>{if(last)finish();else{S.i++;ask()}};
}

function finish(){
  D.hist.push({name:D.name,score:S.score,mode:S.mode,at:Date.now()});save(D);
  const g={};S.miss.forEach(m=>(g[m.t]=g[m.t]||[]).push(m));
  const topics=Object.keys(g);
  const msg=S.score>=N*.9?"Exam ready.":S.score>=N*.7?"Solid. Tighten the gaps below.":S.score>=N*.5?"Getting there. Work through the cheat sheet.":"Start with the cheat sheet, then try again.";
  $.innerHTML=`<h1>Exam complete</h1>
  <div class="card"><div class="big">${S.score}/${N}</div><p>${msg}</p><p class="mute" id="sv">Saving to the class scoreboard…</p></div>
  <h2>${esc(D.name)}’s cheat sheet</h2>
  ${topics.length?`<p class="mute">Topics to revise: ${topics.map(esc).join(", ")}.</p>`+topics.map(t=>`<div class="card"><b>${esc(t)}</b>${g[t].map(m=>`<div class="miss"><p>${esc(m.q)}</p><p class="right">Answer: ${esc(m.o[m.a])}</p><p class="mute">You chose: ${esc(m.o[m.got])}</p><p>${esc(m.e)}</p></div>`).join("")}</div>`).join(""):`<div class="card"><p>No gaps this round. Try the other question order for a fresh run.</p></div>`}
  <div class="row noprint"><button class="primary" id="again">Take it again</button><button id="pr">Print or save as PDF</button><button id="hm">Scoreboard</button></div>`;
  document.getElementById("again").onclick=()=>{S={mode:S.mode,qs:build(S.mode),i:0,score:0,miss:[],done:false};ask()};
  document.getElementById("pr").onclick=()=>window.print();
  document.getElementById("hm").onclick=home;
  fetch(API+"/results",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:D.name,score:S.score,total:N,mode:S.mode})})
    .then(r=>{document.getElementById("sv").textContent=r.ok?"Score saved to the class scoreboard.":"Could not save to the class scoreboard."})
    .catch(()=>{const e=document.getElementById("sv");if(e)e.textContent="Could not reach the class scoreboard. Your score is saved on this device."});
}
home();
</script>
</body>
</html>
